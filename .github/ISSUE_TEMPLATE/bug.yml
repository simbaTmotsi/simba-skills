name: Bug
description: A skill did the wrong thing in a real session. One problem per issue.
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Keep it short and put the steps first. Remove hostnames, paths, names and secrets from anything you paste. Security problems go to the Security tab instead.
  - type: input
    id: skill
    attributes:
      label: Skill
      description: e.g. production-safe-loops
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Plugin version and agent
      description: e.g. 0.1.0, Claude Code 2.1.323 (plugin install)
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you asked, and what the agent did. Paste the relevant part of the session.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What should have happened, and which line of SKILL.md says so (if any).
    validations:
      required: true
